<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the `--base-href` argument of `flutter build web`
    (/play/tictactoe/ for appversegames.com).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play Tic Tac Toe free against the computer on Easy, Medium or Hard, with a friend on the same device, or watch two computers play and explain every move. By App Verse Games.">
  <meta name="theme-color" content="#16193A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tic Tac Toe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tic Tac Toe | App Verse Games</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #F6F3EC;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font: 500 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #16193A;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(22, 25, 58, 0.15);
      border-top-color: #F2A541;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #loading .spinner { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <!-- Shown until the game starts; removed by flutter_bootstrap.js. -->
  <div id="loading" role="status" aria-live="polite">
    <div class="spinner"></div>
    <div>Loading Tic Tac Toe…</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
